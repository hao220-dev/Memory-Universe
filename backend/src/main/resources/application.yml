server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: memory-universe
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # 生产环境必须通过 JWT_SECRET 注入（>=32 字节）；dev/test profile 提供本地默认值
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
    issuer: memory-universe
  storage:
    type: ${STORAGE_TYPE:minio}
    local:
      root: ${LOCAL_STORAGE_ROOT:./data/uploads}
      public-base-url: ${LOCAL_STORAGE_PUBLIC_BASE_URL:/media}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:memory-universe}
    public-base-url: ${MINIO_PUBLIC_BASE_URL:http://localhost:9000/memory-universe}
  bootstrap:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:}
      nickname: ${ADMIN_NICKNAME:馆长}

logging:
  level:
    com.memoryuniverse: info
