spring:
  datasource:
    url: jdbc:h2:mem:memory_universe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

app:
  jwt:
    secret: memory-universe-test-secret-key-at-least-32-bytes-long
  storage:
    type: local
    local:
      root: ./target/test-uploads
      public-base-url: /media
  bootstrap:
    admin:
      username: admin
      # 仅用于自动化测试的内存数据库，不会进入安装包
      password: Test@123456
      nickname: 测试馆长

logging:
  level:
    com.memoryuniverse: warn
    org.springframework: warn
